<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
    </head>
    <body>
        <header>
            <!-- Logo de la pagina -->
            <div>
                <img src="Daily Meetings.jpeg" alt="#">
            </div>
            <!-- Barra de navegacion -->

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="paginas/servicios.html">Servicios</a></li>
                    <li><a href="paginas/contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <!-- Boton 'contactanos' -->
            <a href="paginas/contacto.html">
                <button>Contactanos</button>
            </a>
        </header>
        <!-- formulario de la pagina -->
        <main>
            <div>
                <form action="/procesarDatos" method="post">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" required
                        placeholder="Ingresa tu nombre">

                    <label for="apellido">Apellido:</label>
                    <input type="text" name="apellido" id="apellido" required
                        placeholder="Ingresa tu apellido">

                    <label for="telefono">Telefono</label>
                    <input type="tel" name="telefono" id="telefono" required
                        placeholder="Ingresa tu telefono">

                    <label for="mensaje">Mensaje</label>
                    <textarea name="mensaje" id="mensaje"
                        placeholder="Ingresa tu mensaje"></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </main>
        <footer class="footer">Todos los derechos de esta pagina estan
            reservados.</footer>
    </body>
</html>
